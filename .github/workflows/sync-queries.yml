name: Verify Python Query Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - expr/queries/**
      - core/queries/**
      - udl/queries/**
      - bindings/python/tree_sitter_objectscript/queries/**
      - bindings/python/tree_sitter_objectscript_core/queries/**
      - bindings/python/tree_sitter_objectscript_udl/queries/**
      - bindings/python/tree_sitter_objectscript_expr/queries/**
      - scripts/sync_queries.py
      - Makefile
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_python_queries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify Python query directories are synchronized
        run: python3 scripts/sync_queries.py --check-python
