name: Sync Queries

on:
  push:
    paths:
      - expr/queries/**
      - core/queries/**
      - udl/queries/**
      - bindings/python/tree_sitter_objectscript/queries/**
      - bindings/python/tree_sitter_objectscript_core/queries/**
      - bindings/python/tree_sitter_objectscript_udl/queries/**
      - bindings/python/tree_sitter_objectscript_expr/queries/**
      - scripts/sync_queries.py
      - Makefile
      - .github/workflows/sync-queries.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize and sync query trees
        run: |
          make formatquery
          python3 scripts/sync_queries.py

      - name: Commit synchronized files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(queries): sync layered queries and python bindings"
          file_pattern: |
            core/queries/*.scm
            udl/queries/*.scm
            bindings/python/tree_sitter_objectscript/queries/*.scm
            bindings/python/tree_sitter_objectscript_core/queries/*.scm
            bindings/python/tree_sitter_objectscript_udl/queries/*.scm
            bindings/python/tree_sitter_objectscript_expr/queries/*.scm
