name: CI

on:
  push:
    branches: [workflow_and_bindings]
    paths:
      - udl/grammar.js
      - udl/src/**
      - udl/test/**
      - udl/queries/**
      - objectscript/grammar.js
      - objectscript/src/**
      - objectscript/test/**
      - core/grammar.js
      - core/src/**
      - core/test/**
      - core/queries/**
      - expr/grammar.js
      - expr/src/**
      - expr/test/**
      - expr/queries/**
      - bindings/**
      - examples/**
      - binding.gyp
      - .tsqueryrc.json
      - .github/workflows/ci.yml
      - "common/*"
      - udl/package.json
  pull_request:
    paths:
      - udl/grammar.js
      - udl/src/**
      - udl/test/**
      - udl/queries/**
      - objectscript/grammar.js
      - objectscript/src/**
      - objectscript/test/**
      - core/grammar.js
      - core/src/**
      - core/test/**
      - core/queries/**
      - expr/grammar.js
      - expr/src/**
      - expr/test/**
      - expr/queries/**
      - bindings/**
      - examples/**
      - binding.gyp
      - .tsqueryrc.json
      - .github/workflows/ci.yml
      - "common/*"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
          test-parser-cmd: |
            set -euo pipefail
            while IFS= read -r grammar_dir; do
              (cd "$grammar_dir" && tree-sitter test)
            done < <(jq -r '.grammars[].path // "."' tree-sitter.json)

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Build parser
        shell: bash
        run: |-
          set -euo pipefail
          while IFS=$'\t' read -r grammar_dir grammar_name; do
            (
              cd "$grammar_dir"
              tree-sitter build

              built_parser=""
              for ext in so dylib dll wasm; do
                if [[ -f "parser.$ext" ]]; then
                  built_parser="parser.$ext"
                  break
                fi
              done

              if [[ -z "$built_parser" ]]; then
                echo "No parser artifact produced for $grammar_name in $grammar_dir" >&2
                exit 1
              fi

              cp "$built_parser" "$grammar_name.${built_parser##*.}"
            )
          done < <(jq -r '.grammars[] | [.path // ".", .name] | @tsv' tree-sitter.json)
      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz
      - name: Check queries
        run: ./ts_query_ls check -f core/queries udl/queries expr/queries

  examples:
    name: Parse examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Parse .cls examples with UDL parser
        shell: bash
        run: |-
          set -euo pipefail

          repo_root="$(pwd)"
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "Parsing $file with parser udl"
            (
              cd udl
              tree-sitter parse --quiet "$repo_root/$file"
            )
          done < <(find examples -type f -name '*.cls' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No .cls examples found under examples/"
          fi
  
