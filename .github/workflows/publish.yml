name: Publish packages

on:
  push:
    branches: [workflow_and_bindings]
    # tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github:
    if: github.repository == 'hkimura-intersys/tree-sitter-objectscript'
    uses: tree-sitter/workflows/.github/workflows/release.yml@main
    with:
      generate: true
  npm:
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@31a611b89757509757378e3d94f28a41a782d9df
    with:
      generate: true
      attestations: true
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  pypi:
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@4496d01d44b1c60efe484a98756b5544f07f1db2
    with:
      generate: true
      attestations: true
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}

  crates:
    if: github.repository == 'hkimura-intersys/tree-sitter-objectscript'
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      generate: true
